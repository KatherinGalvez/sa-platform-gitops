apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservicio.fullname" . }}
  labels:
    {{- include "microservicio.labels" . | nindent 4 }}
spec:
  # Antes: fijo en ClusterIP. Ahora configurable por microservicio via
  # values (.Values.<servicio>.service.type) — en la nube, api-gateway
  # usa LoadBalancer para obtener IP pública real; el resto se queda en
  # ClusterIP (solo deben verse entre sí, no desde internet).
  type: {{ (.Values.service | default dict).type | default "ClusterIP" }}
  selector:
    {{- include "microservicio.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http