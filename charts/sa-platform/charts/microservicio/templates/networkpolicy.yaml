{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microservicio.fullname" . }}
  labels:
    {{- include "microservicio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "microservicio.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.allowOnlyFromGateway }}
    # Caso normal: solo el pod del api-gateway (identificado por la
    # etiqueta academia.io/role=gateway) puede iniciar tráfico hacia mí.
    # Cualquier otro pod del namespace queda bloqueado por defecto, porque
    # en cuanto un NetworkPolicy selecciona un pod para Ingress, Kubernetes
    # deniega todo lo que no esté explícitamente permitido aquí.
    - from:
        - podSelector:
            matchLabels:
              academia.io/role: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    {{- else if .Values.networkPolicy.allowFromIngressController }}
    # Caso especial: SOLO el api-gateway usa esta rama, porque es el único
    # que debe recibir tráfico legítimo desde fuera del clúster (a través
    # del Ingress Controller, que vive en su propio namespace).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    {{- end }}
{{- end }}
