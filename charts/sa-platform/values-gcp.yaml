# --- Ya no usamos el Ingress local (sa-academia.local no resuelve en
#     internet) — la IP pública la da el LoadBalancer de api-gateway ---
ingress:
  enabled: false

# --- StorageClass real del proveedor + requests reducidos en las 6 bases
#     (antes 100m/128Mi cada una, ahora 50m/64Mi — ya confirmado que
#     "standard-rwo" funciona, solo ajustamos cuánto reserva cada pod) ---
postgresql-auth:
  primary:
    persistence:
      storageClass: standard-rwo
      size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

postgresql-cursos:
  primary:
    persistence:
      storageClass: standard-rwo
      size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

postgresql-inscripciones:
  primary:
    persistence:
      storageClass: standard-rwo
      size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

postgresql-docentes:
  primary:
    persistence:
      storageClass: standard-rwo
      size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

postgresql-calificaciones:
  primary:
    persistence:
      storageClass: standard-rwo
      size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

postgresql-notas:
  primary:
    persistence:
      storageClass: standard-rwo
      size: 1Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

# RabbitMQ pedía 250m de CPU por defecto — es el más pesado de los que
# faltan por agendar. Lo bajamos a 100m, de sobra para el volumen de
# mensajes de esta práctica.
rabbitmq:
  persistence:
    storageClass: standard-rwo
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }