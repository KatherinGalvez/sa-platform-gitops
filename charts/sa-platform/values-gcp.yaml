# values-gcp.yaml — overrides para el despliegue en GKE (Práctica 6).
# Uso: helm install sa-platform . -f values.yaml -f values-gcp.yaml -f values-secrets.yaml -n sa-p6 --create-namespace
#
# Clúster: 3 nodos e2-medium. Cada nodo solo deja ~940m de CPU disponible
# para cargas propias (el resto lo reserva GKE para sus componentes de
# sistema: fluentbit, kube-dns, gke-metrics-agent, etc.) — por eso los
# requests de CPU/memoria van más ajustados que en values-dev.yaml, para
# caber sin necesitar un 4to nodo.

# --- Imágenes: ahora en Artifact Registry, ya no locales ---
api-gateway:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    repository: us-central1-docker.pkg.dev/sa-p6-202006633/sa-academia-repo/api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 150m, memory: 128Mi }

