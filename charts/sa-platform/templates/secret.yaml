{{/*
Secret compartido que consumen todos los microservicios. Antes tenía UN
DATABASE_URL genérico; ahora tiene 6, uno por microservicio con base
propia (patrón "database per service"). Cada microservicio pide, vía
"envSecretRef" en su values.yaml, SOLO la clave que le corresponde,
mapeada a la variable de entorno DATABASE_URL que su código ya espera.
JWT_SECRET / AES_SECRET_KEY / RABBITMQ_URL se mantienen compartidos
porque no son datos de negocio propios de un servicio.
Los valores reales viven en "values-secrets.yaml" (gitignored) o se pasan
con --set en el `helm install`, NUNCA en values.yaml/values-dev.yaml/
values-prod.yaml (que sí van al repositorio).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
type: Opaque
stringData:
  DATABASE_URL_AUTH: "postgresql://{{ (index .Values "postgresql-auth" "auth" "username") }}:{{ required "Debes definir postgresql-auth.auth.password (ver values.example.yaml)" (index .Values "postgresql-auth" "auth" "password") }}@sa-platform-postgresql-auth:5432/{{ (index .Values "postgresql-auth" "auth" "database") }}"

  DATABASE_URL_CURSOS: "postgresql://{{ (index .Values "postgresql-cursos" "auth" "username") }}:{{ required "Debes definir postgresql-cursos.auth.password (ver values.example.yaml)" (index .Values "postgresql-cursos" "auth" "password") }}@sa-platform-postgresql-cursos:5432/{{ (index .Values "postgresql-cursos" "auth" "database") }}"

  DATABASE_URL_INSCRIPCIONES: "postgresql://{{ (index .Values "postgresql-inscripciones" "auth" "username") }}:{{ required "Debes definir postgresql-inscripciones.auth.password (ver values.example.yaml)" (index .Values "postgresql-inscripciones" "auth" "password") }}@sa-platform-postgresql-inscripciones:5432/{{ (index .Values "postgresql-inscripciones" "auth" "database") }}"

  DATABASE_URL_DOCENTES: "postgresql://{{ (index .Values "postgresql-docentes" "auth" "username") }}:{{ required "Debes definir postgresql-docentes.auth.password (ver values.example.yaml)" (index .Values "postgresql-docentes" "auth" "password") }}@sa-platform-postgresql-docentes:5432/{{ (index .Values "postgresql-docentes" "auth" "database") }}"

  DATABASE_URL_CALIFICACIONES: "postgresql://{{ (index .Values "postgresql-calificaciones" "auth" "username") }}:{{ required "Debes definir postgresql-calificaciones.auth.password (ver values.example.yaml)" (index .Values "postgresql-calificaciones" "auth" "password") }}@sa-platform-postgresql-calificaciones:5432/{{ (index .Values "postgresql-calificaciones" "auth" "database") }}"

  DATABASE_URL_NOTAS: "postgresql://{{ (index .Values "postgresql-notas" "auth" "username") }}:{{ required "Debes definir postgresql-notas.auth.password (ver values.example.yaml)" (index .Values "postgresql-notas" "auth" "password") }}@sa-platform-postgresql-notas:5432/{{ (index .Values "postgresql-notas" "auth" "database") }}"

  RABBITMQ_URL: "amqp://{{ .Values.rabbitmq.auth.username }}:{{ required "Debes definir rabbitmq.auth.password (ver values.example.yaml)" .Values.rabbitmq.auth.password }}@sa-platform-rabbitmq:5672"
  JWT_SECRET: {{ required "Debes definir secrets.jwtSecret (ver values.example.yaml)" .Values.secrets.jwtSecret | quote }}
  AES_SECRET_KEY: {{ required "Debes definir secrets.aesSecretKey, EXACTAMENTE 32 caracteres (ver values.example.yaml)" .Values.secrets.aesSecretKey | quote }}
