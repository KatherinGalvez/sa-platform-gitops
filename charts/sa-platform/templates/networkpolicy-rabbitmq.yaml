apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sa-platform-rabbitmq-restrict
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              academia.io/role-broker: broker-client
      ports:
        - protocol: TCP
          port: 5672    # AMQP
        - protocol: TCP
          port: 15672   # panel de administración (opcional, útil para depurar)
