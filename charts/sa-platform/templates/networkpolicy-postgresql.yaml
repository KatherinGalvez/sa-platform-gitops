{{/*
Antes había UNA NetworkPolicy de Postgres que dejaba pasar a cualquier pod
con la etiqueta genérica "academia.io/role: db-client". Ahora hay 6 bases
separadas, así que hace falta una NetworkPolicy POR base, cada una
permitiendo el paso SOLO a su microservicio dueño (etiqueta específica,
no genérica). El selector de cada base usa el label extra
"academia.io/db-instance" que le agregamos en values.yaml
(postgresql-<x>.primary.podLabels) para distinguir las 6 instancias del
mismo Release.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sa-platform-postgresql-auth-restrict
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      academia.io/db-instance: auth
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              academia.io/role: auth-db-client
      ports:
        - protocol: TCP
          port: 5432
---
