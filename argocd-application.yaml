apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mi-app-prod
  namespace: argocd
spec:
  project: default
  source:
    # CAMBIA esta URL por la de tu repo GitOps (público, independiente del de código)
    repoURL: https://github.com/KatherinGalvez/sa-platform-gitops.git
    targetRevision: main
    path: charts/sa-platform
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: produccion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
