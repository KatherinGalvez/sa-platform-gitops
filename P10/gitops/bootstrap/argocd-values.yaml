# Valores del chart argo-cd 10.9.2 para el cluster p10-obs.
# Lo instala scripts/bootstrap.sh; a partir de ahi todo lo despliega ArgoCD.
configs:
  params:
    # TLS lo termina el port-forward / Web Preview de Cloud Shell
    server.insecure: true
  cm:
    application.resourceTrackingMethod: annotation
    # Salud de Application: las sync-waves del app-of-apps esperan a que cada
    # aplicacion hija este Healthy antes de pasar a la siguiente ola.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
