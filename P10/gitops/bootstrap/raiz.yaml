# Aplicacion raiz (app-of-apps) de la Practica 10. Es lo unico que se aplica a
# mano (bootstrap.sh); todo lo demas lo crea ArgoCD desde P10/gitops/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-raiz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KatherinGalvez/sa-platform-gitops.git
    targetRevision: main
    path: P10/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
