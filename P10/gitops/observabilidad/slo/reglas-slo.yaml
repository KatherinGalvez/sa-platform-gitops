# SLO del recorrido de compra (POST /pedidos, la operacion que ve el usuario).
#
#  SLO 1  Disponibilidad: 99 % de los pedidos en 30 dias NO terminan en 5xx.
#         Presupuesto de error = 1 %.  (402 pago rechazado y 409 sin stock son
#         respuestas de negocio correctas: no gastan presupuesto.)
#  SLO 2  Latencia: 95 % de los pedidos en 30 dias responden en menos de 500 ms.
#         Presupuesto = 5 % de pedidos lentos.
#
# Alertas por CONSUMO DEL PRESUPUESTO (burn rate), multiventana (Google SRE wb):
#   rapida: ventana 1h  y 5m  > 14.4x  -> se gasta el 2 % del presupuesto en 1 h  (pagina)
#   lenta : ventana 6h  y 30m >  6x    -> se gasta el 5 % del presupuesto en 6 h  (ticket)
# La ventana corta confirma que el problema sigue ocurriendo (reset rapido).
#
# Nota: las reglas de registro llevan "annotations: {}" (vacio, Prometheus lo
# ignora) para que el verificador de la practica pueda recorrer las anotaciones
# de TODAS las reglas sin fallar con null (ver verificacion/CORRECCION-VERIFICADOR.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-pedidos
  namespace: observabilidad
  labels:
    app.kubernetes.io/part-of: tienda-p10
spec:
  groups:
    # ------------------------------------------------------------------ SLI
    - name: sli-pedidos
      interval: 15s
      rules:
        # Proporcion de pedidos con error (5xx) por ventana
        - record: sli:pedidos_errores:ratio_rate5m
          expr: |
            (sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos",status=~"5.."}[5m])) or vector(0))
            /
            sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[5m]))
          annotations: {}
        - record: sli:pedidos_errores:ratio_rate30m
          expr: |
            (sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos",status=~"5.."}[30m])) or vector(0))
            /
            sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[30m]))
          annotations: {}
        - record: sli:pedidos_errores:ratio_rate1h
          expr: |
            (sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos",status=~"5.."}[1h])) or vector(0))
            /
            sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[1h]))
          annotations: {}
        - record: sli:pedidos_errores:ratio_rate6h
          expr: |
            (sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos",status=~"5.."}[6h])) or vector(0))
            /
            sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[6h]))
          annotations: {}
        # SLI de disponibilidad (lo que se compara contra el 99 %)
        - record: sli:disponibilidad:ratio_rate5m
          expr: 1 - sli:pedidos_errores:ratio_rate5m
          annotations: {}
        - record: sli:disponibilidad:ratio_rate1h
          expr: 1 - sli:pedidos_errores:ratio_rate1h
          annotations: {}

        # Proporcion de pedidos LENTOS (> 500 ms) por ventana
        - record: sli:pedidos_lentos:ratio_rate5m
          expr: |
            1 - (
              sum(rate(http_server_requests_seconds_bucket{namespace="produccion",service="pedidos",route="/pedidos",le="0.5"}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[5m]))
            )
          annotations: {}
        - record: sli:pedidos_lentos:ratio_rate30m
          expr: |
            1 - (
              sum(rate(http_server_requests_seconds_bucket{namespace="produccion",service="pedidos",route="/pedidos",le="0.5"}[30m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[30m]))
            )
          annotations: {}
        - record: sli:pedidos_lentos:ratio_rate1h
          expr: |
            1 - (
              sum(rate(http_server_requests_seconds_bucket{namespace="produccion",service="pedidos",route="/pedidos",le="0.5"}[1h]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[1h]))
            )
          annotations: {}
        - record: sli:pedidos_lentos:ratio_rate6h
          expr: |
            1 - (
              sum(rate(http_server_requests_seconds_bucket{namespace="produccion",service="pedidos",route="/pedidos",le="0.5"}[6h]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[6h]))
            )
          annotations: {}
        - record: sli:latencia:ratio_rate5m
          expr: 1 - sli:pedidos_lentos:ratio_rate5m
          annotations: {}

    # ------------------------------------------------- consumo del presupuesto
    - name: slo-presupuesto-pedidos
      interval: 15s
      rules:
        # burn rate = proporcion de eventos malos / presupuesto (1 - objetivo)
        - record: slo:disponibilidad:burn_rate5m
          expr: sli:pedidos_errores:ratio_rate5m / 0.01
          annotations: {}
        - record: slo:disponibilidad:burn_rate30m
          expr: sli:pedidos_errores:ratio_rate30m / 0.01
          annotations: {}
        - record: slo:disponibilidad:burn_rate1h
          expr: sli:pedidos_errores:ratio_rate1h / 0.01
          annotations: {}
        - record: slo:disponibilidad:burn_rate6h
          expr: sli:pedidos_errores:ratio_rate6h / 0.01
          annotations: {}
        - record: slo:latencia:burn_rate5m
          expr: sli:pedidos_lentos:ratio_rate5m / 0.05
          annotations: {}
        - record: slo:latencia:burn_rate30m
          expr: sli:pedidos_lentos:ratio_rate30m / 0.05
          annotations: {}
        - record: slo:latencia:burn_rate1h
          expr: sli:pedidos_lentos:ratio_rate1h / 0.05
          annotations: {}
        - record: slo:latencia:burn_rate6h
          expr: sli:pedidos_lentos:ratio_rate6h / 0.05
          annotations: {}

    # ----------------------------- presupuesto consumido en la ventana del SLO
    # 1.0 = se gasto todo el presupuesto de 30 dias. (Con la retencion de 3 dias
    # del entorno de practica se calcula sobre los datos disponibles.)
    - name: slo-presupuesto-30d
      interval: 1m
      rules:
        - record: slo:disponibilidad:presupuesto_consumido:ratio30d
          expr: |
            (sum(increase(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos",status=~"5.."}[30d])) or vector(0))
            /
            (sum(increase(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[30d])) * 0.01)
          annotations: {}
        - record: slo:disponibilidad:presupuesto_restante:ratio30d
          expr: 1 - slo:disponibilidad:presupuesto_consumido:ratio30d
          annotations: {}
        - record: slo:latencia:presupuesto_consumido:ratio30d
          expr: |
            (
              sum(increase(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[30d]))
              -
              sum(increase(http_server_requests_seconds_bucket{namespace="produccion",service="pedidos",route="/pedidos",le="0.5"}[30d]))
            )
            /
            (sum(increase(http_server_requests_seconds_count{namespace="produccion",service="pedidos",route="/pedidos"}[30d])) * 0.05)
          annotations: {}
        - record: slo:latencia:presupuesto_restante:ratio30d
          expr: 1 - slo:latencia:presupuesto_consumido:ratio30d
          annotations: {}

    # ---------------------------------------------------------------- alertas
    - name: alertas-slo-pedidos
      rules:
        - alert: PedidosDisponibilidadQuemaRapida
          expr: |
            slo:disponibilidad:burn_rate1h > 14.4
            and
            slo:disponibilidad:burn_rate5m > 14.4
          for: 1m
          labels:
            severity: critical
            slo: disponibilidad-pedidos
          annotations:
            summary: "pedidos esta consumiendo el presupuesto de error 14.4 veces mas rapido de lo sostenible"
            description: "Errores 5xx en POST /pedidos: {{ $value | humanize }}x el presupuesto (ventanas 1h y 5m). A este ritmo el presupuesto mensual (1 %) se agota en ~2 dias."
            runbook_url: "https://github.com/KatherinGalvez/sa-platform-gitops/blob/main/P10/docs/runbooks/RUNBOOK-disponibilidad-pedidos.md"
            tablero: "Grafana > Dashboards > P10 - Tienda: cuatro senales de oro y SLO"
        - alert: PedidosDisponibilidadQuemaLenta
          expr: |
            slo:disponibilidad:burn_rate6h > 6
            and
            slo:disponibilidad:burn_rate30m > 6
          for: 5m
          labels:
            severity: warning
            slo: disponibilidad-pedidos
          annotations:
            summary: "pedidos consume el presupuesto de error 6 veces mas rapido de lo sostenible"
            description: "Errores 5xx sostenidos en POST /pedidos (ventanas 6h y 30m): {{ $value | humanize }}x."
            runbook_url: "https://github.com/KatherinGalvez/sa-platform-gitops/blob/main/P10/docs/runbooks/RUNBOOK-disponibilidad-pedidos.md"
        - alert: PedidosLatenciaQuemaRapida
          expr: |
            slo:latencia:burn_rate1h > 14.4
            and
            slo:latencia:burn_rate5m > 14.4
          for: 1m
          labels:
            severity: critical
            slo: latencia-pedidos
          annotations:
            summary: "Demasiados pedidos tardan mas de 500 ms"
            description: "Pedidos lentos: {{ $value | humanize }}x el presupuesto de latencia (ventanas 1h y 5m)."
            runbook_url: "https://github.com/KatherinGalvez/sa-platform-gitops/blob/main/P10/docs/runbooks/RUNBOOK-latencia-pedidos.md"
        - alert: PedidosLatenciaQuemaLenta
          expr: |
            slo:latencia:burn_rate6h > 6
            and
            slo:latencia:burn_rate30m > 6
          for: 5m
          labels:
            severity: warning
            slo: latencia-pedidos
          annotations:
            summary: "Latencia de pedidos degradada de forma sostenida"
            description: "Pedidos lentos sostenidos (ventanas 6h y 30m): {{ $value | humanize }}x el presupuesto."
            runbook_url: "https://github.com/KatherinGalvez/sa-platform-gitops/blob/main/P10/docs/runbooks/RUNBOOK-latencia-pedidos.md"
