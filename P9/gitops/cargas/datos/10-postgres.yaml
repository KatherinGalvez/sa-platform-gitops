# Base de datos con volumen persistente (StorageClass por defecto de GKE).
# 1 replica: es un PUNTO UNICO DE FALLO declarado (ver informe de DR).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres, practica: p9 }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app: postgres, practica: p9 }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, practica: p9 }
      annotations:
        # Antes de copiar el volumen, Velero deja un volcado CONSISTENTE dentro
        # del mismo volumen (copia de seguridad logica de respaldo) y fuerza un
        # CHECKPOINT para minimizar lo pendiente en el WAL.
        pre.hook.backup.velero.io/container: postgres
        pre.hook.backup.velero.io/command: '["/bin/sh","-c","mkdir -p /var/lib/postgresql/data/volcado && pg_dump -U \"$POSTGRES_USER\" -d p9 -f /var/lib/postgresql/data/volcado/p9.sql && psql -U \"$POSTGRES_USER\" -d p9 -c CHECKPOINT"]'
        pre.hook.backup.velero.io/timeout: 120s
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_DB
              value: p9
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-credenciales, key: usuario } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credenciales, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d p9"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d p9"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: { app: postgres, practica: p9 }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
