# Esquema y datos semilla verificables. Solo se ejecuta cuando el volumen esta
# VACIO (primer arranque); tras una restauracion el volumen ya trae los datos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: { app: postgres, practica: p9 }
data:
  01-esquema.sql: |
    CREATE TABLE IF NOT EXISTS pedidos (
      id       SERIAL PRIMARY KEY,
      cliente  TEXT NOT NULL,
      producto TEXT NOT NULL,
      total    NUMERIC(10,2) NOT NULL,
      creado   TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    -- Registro "canario": el CronJob escritor-marcas inserta una fila por minuto.
    -- La ultima marca recuperada tras una restauracion da el RPO REAL.
    CREATE TABLE IF NOT EXISTS marcas (
      id     SERIAL PRIMARY KEY,
      creado TIMESTAMPTZ NOT NULL DEFAULT now(),
      origen TEXT NOT NULL
    );
    INSERT INTO pedidos (cliente, producto, total)
    SELECT 'cliente-' || lpad(g::text, 3, '0'),
           (ARRAY['teclado','monitor','mouse','laptop','audifonos'])[1 + g % 5],
           round((g * 37.5 % 900 + 25)::numeric, 2)
    FROM generate_series(1, 50) AS g;
    INSERT INTO marcas (origen) VALUES ('semilla-inicial');
    -- Rol de solo lectura para la API REST
    CREATE ROLE web_anon NOLOGIN;
    GRANT USAGE ON SCHEMA public TO web_anon;
    GRANT SELECT ON pedidos, marcas TO web_anon;
    GRANT web_anon TO app;
