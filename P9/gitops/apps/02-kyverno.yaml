# Ola 0: motor de politicas de admision (flujo de la Practica 8).
# 3 replicas del controlador de admision: el webhook sigue disponible
# mientras se drena un nodo (si no, la creacion de pods quedaria bloqueada).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController:
          replicas: 3
          podDisruptionBudget:
            enabled: true
            minAvailable: 2
          container:
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { memory: 384Mi }
        backgroundController:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        cleanupController:
          enabled: false
        reportsController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
