# Ola 1: permisos y script de la restauracion automatica. El Job se ejecuta
# como hook PreSync de la app "datos" (ola 2), antes de crear la base de datos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restauracion-dr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/KatherinGalvez/sa-platform-gitops.git
    targetRevision: main
    path: P9/gitops/plataforma/restauracion
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: false, selfHeal: true }
