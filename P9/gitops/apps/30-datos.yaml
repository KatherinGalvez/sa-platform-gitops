# Ola 2: servicio con estado (PostgreSQL + API REST) y recursos de resiliencia.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/KatherinGalvez/sa-platform-gitops.git
    targetRevision: main
    path: P9/gitops/cargas/datos
  destination:
    server: https://kubernetes.default.svc
    namespace: datos
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
