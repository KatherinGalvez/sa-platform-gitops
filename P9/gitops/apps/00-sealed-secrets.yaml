# Ola 0: controlador de Sealed Secrets. Arranca con la llave que Terraform
# restauro desde Secret Manager (no genera una nueva).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # El repositorio Helm publicado (bitnami-labs.github.io) devuelve 404:
    # se usa el chart directamente desde el repositorio Git oficial, fijado a
    # la etiqueta de la version.
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: helm-v2.20.0
    path: helm/sealed-secrets
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        # Sin renovacion automatica: una llave nueva generada dentro del cluster
        # no estaria respaldada en Secret Manager (punto unico de fallo).
        keyrenewperiod: "0"
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
