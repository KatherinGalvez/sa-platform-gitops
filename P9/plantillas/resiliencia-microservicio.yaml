# Bloque de resiliencia para cada microservicio de P4/P5 (en sus manifiestos de P8).
# Reemplace MI-SERVICIO, puerto y rutas de salud. Sirve igual para Deployment
# o para Rollout de Argo Rollouts (va dentro de spec.template.spec).

# ---- 1) Dentro del Deployment/Rollout ----
# spec:
#   replicas: 3                      # >= 2; con 3 nodos, 3 es lo ideal
#   template:
#     spec:
#       affinity:
#         podAntiAffinity:
#           preferredDuringSchedulingIgnoredDuringExecution:
#             - weight: 100
#               podAffinityTerm:
#                 topologyKey: kubernetes.io/hostname
#                 labelSelector:
#                   matchLabels: { app: MI-SERVICIO }
#       topologySpreadConstraints:
#         - maxSkew: 1
#           topologyKey: kubernetes.io/hostname
#           whenUnsatisfiable: ScheduleAnyway
#           labelSelector:
#             matchLabels: { app: MI-SERVICIO }
#       containers:
#         - name: MI-SERVICIO
#           readinessProbe:
#             httpGet: { path: /health/ready, port: 8080 }
#             periodSeconds: 5
#           livenessProbe:
#             httpGet: { path: /health/live, port: 8080 }
#             initialDelaySeconds: 15
#             periodSeconds: 10

# ---- 2) PodDisruptionBudget (archivo aparte) ----
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: MI-SERVICIO
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: MI-SERVICIO
